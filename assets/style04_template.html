<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{页面名称}}</title>
  <style>
    :root {
      --primary: #ff6b6b;
      --primary-dark: #ee5253;
      --accent: #feca57;
      --bg: #f5f6fa;
      --surface: #ffffff;
      --muted: #f8f9fa;
      --line: #e9ecef;
      --text: #2f3542;
      --subtext: #6c757d;
      --success-bg: #d4edda;
      --success-text: #155724;
      --info-bg: #cce5ff;
      --info-text: #0066cc;
      --warning-bg: #fff3cd;
      --warning-text: #856404;
      --danger-bg: #f8d7da;
      --danger-text: #721c24;
      --neutral-bg: #e9ecef;
      --neutral-text: #6c757d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .page-shell {
      min-height: 100vh;
      background: var(--bg);
    }

    .page-header {
      position: relative;
      min-height: 84px;
      padding: 20px 24px;
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 24px rgba(255, 107, 107, 0.22);
    }

    .page-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
      text-align: center;
    }

    .page-subtitle {
      margin: 4px 0 0;
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      text-align: center;
    }

    .header-actions {
      position: absolute;
      right: 24px;
      top: 22px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .prd-open-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid rgba(255, 255, 255, 0.58);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.18);
      color: #ffffff;
      padding: 8px 12px;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    }

    .prd-open-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.26);
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.16);
    }

    [data-prd-target] {
      scroll-margin: 96px;
    }

    body.show-interactive [data-prd-target] {
      outline: 2px dashed rgba(83, 82, 237, 0.62);
      outline-offset: 4px;
      box-shadow: 0 0 0 4px rgba(83, 82, 237, 0.08);
    }

    .prd-target-highlight {
      position: relative;
      z-index: 95;
      outline: 3px solid #ff6b6b !important;
      outline-offset: 6px;
      animation: prdBreathingGlow 1.1s ease-in-out infinite;
    }

    @keyframes prdBreathingGlow {
      0% {
        box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.56), 0 0 0 5px rgba(83, 82, 237, 0.12);
      }
      50% {
        box-shadow: 0 0 0 8px rgba(255, 107, 107, 0.2), 0 0 0 14px rgba(83, 82, 237, 0.08);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(255, 107, 107, 0.56), 0 0 0 5px rgba(83, 82, 237, 0.12);
      }
    }

    .content {
      padding: 24px;
    }

    .notice {
      margin-bottom: 16px;
      padding: 10px 12px;
      border: 1px solid #ffe8a3;
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      background: #fff8df;
      color: #6d5705;
    }

    .action-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
      margin-bottom: 16px;
    }

    .button-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 14px;
      background: var(--muted);
      color: var(--text);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 16px rgba(47, 53, 66, 0.08);
    }

    .btn-primary {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-dark);
      box-shadow: 0 10px 18px rgba(255, 107, 107, 0.26);
    }

    .btn-danger {
      border-color: #ffb8b8;
      background: #fff5f5;
      color: #c0392b;
    }

    .btn-text {
      border: 0;
      background: transparent;
      color: #6c5ce7;
      padding: 4px 6px;
    }

    .btn-text.danger {
      color: #c0392b;
    }

    .filter-section {
      margin-bottom: 18px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--muted);
    }

    .filter-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(160px, 1fr));
      gap: 16px;
      align-items: end;
    }

    .form-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-item label {
      color: var(--subtext);
      font-size: 13px;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
      padding: 9px 10px;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    .textarea {
      min-height: 92px;
      resize: vertical;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.12);
    }

    .table-container {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
    }

    .table-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .table-toolbar h2 {
      margin: 0;
      font-size: 16px;
    }

    .table-tip {
      color: var(--subtext);
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
      white-space: nowrap;
    }

    th {
      background: #fbfbfc;
      color: #495057;
      font-weight: 600;
    }

    tbody tr:hover {
      background: var(--muted);
    }

    tbody tr:last-child td {
      border-bottom: 0;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 58px;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .status-editing {
      background: var(--neutral-bg);
      color: var(--neutral-text);
    }

    .status-not-active {
      background: var(--info-bg);
      color: var(--info-text);
    }

    .status-active {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .status-expired {
      background: var(--warning-bg);
      color: var(--warning-text);
    }

    .status-invalid {
      background: var(--danger-bg);
      color: var(--danger-text);
    }

    .pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 14px 16px;
      border-top: 1px solid var(--line);
      background: #ffffff;
    }

    .page-buttons {
      display: flex;
      gap: 8px;
    }

    .page-btn {
      min-width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #ffffff;
      color: var(--text);
    }

    .page-btn.active {
      border-color: var(--primary);
      background: var(--primary);
      color: #ffffff;
    }

    .empty-state {
      display: none;
      padding: 42px 16px;
      color: var(--subtext);
      text-align: center;
    }

    .toast {
      position: fixed;
      right: 24px;
      bottom: 24px;
      z-index: 80;
      display: none;
      max-width: min(360px, calc(100vw - 48px));
      border-radius: 8px;
      background: #2f3542;
      color: #ffffff;
      padding: 11px 14px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.24);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.5);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      width: min(720px, 100%);
      max-height: min(760px, calc(100vh - 48px));
      overflow: auto;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.24);
    }

    .modal-header,
    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
    }

    .modal-footer {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }

    .modal-title {
      margin: 0;
      font-size: 17px;
    }

    .modal-body {
      padding: 18px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      color: var(--subtext);
      font-size: 22px;
      line-height: 1;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 10px 14px;
    }

    .detail-label {
      color: var(--subtext);
    }

    .prd-overlay {
      position: fixed;
      inset: 0;
      z-index: 90;
      display: none;
      background: rgba(0, 0, 0, 0.42);
      opacity: 0;
      transition: opacity 0.22s ease;
    }

    .prd-overlay.open {
      display: block;
      opacity: 1;
    }

    .prd-drawer {
      position: fixed;
      top: 0;
      right: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      width: min(600px, 100vw);
      height: 100vh;
      background: #ffffff;
      box-shadow: -16px 0 40px rgba(0, 0, 0, 0.24);
      transform: translateX(100%);
      transition: transform 0.26s ease;
    }

    .prd-drawer.open {
      transform: translateX(0);
    }

    .prd-drawer-header {
      min-height: 72px;
      padding: 16px 20px;
      background: linear-gradient(135deg, #5352ed 0%, #ff6b6b 100%);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .prd-drawer-header h2 {
      margin: 0;
      font-size: 18px;
    }

    .prd-drawer-header p {
      margin: 3px 0 0;
      color: rgba(255, 255, 255, 0.82);
      font-size: 12px;
    }

    .prd-close-btn {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(255, 255, 255, 0.46);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      color: #ffffff;
      font-size: 18px;
      line-height: 1;
    }

    .prd-content {
      flex: 1;
      overflow-y: auto;
      padding: 22px 24px 36px;
    }

    .prd-content h1,
    .prd-content h2,
    .prd-content h3 {
      color: var(--text);
      line-height: 1.35;
    }

    .prd-content h1 {
      margin: 0 0 16px;
      font-size: 22px;
    }

    .prd-content h2 {
      margin: 22px 0 10px;
      padding-left: 10px;
      border-left: 4px solid #5352ed;
      font-size: 17px;
    }

    .prd-content h3 {
      margin: 18px 0 8px;
      font-size: 15px;
    }

    .prd-content p,
    .prd-content li {
      color: #3f4656;
    }

    .prd-content table {
      margin: 10px 0 16px;
      border: 1px solid var(--line);
      font-size: 13px;
    }

    .prd-content th,
    .prd-content td {
      white-space: normal;
      vertical-align: top;
    }

    .prd-content code {
      border-radius: 4px;
      background: #f1f2f6;
      padding: 2px 5px;
      color: #5352ed;
      font-family: Consolas, Monaco, monospace;
    }

    .prd-content pre {
      overflow: auto;
      border-radius: 8px;
      background: #2f3542;
      color: #ffffff;
      padding: 14px;
    }

    .prd-drawer-tools {
      position: sticky;
      top: -22px;
      z-index: 2;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: -22px -24px 16px;
      padding: 12px 24px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
    }

    .prd-region-link {
      display: inline-flex;
      align-items: center;
      min-height: 30px;
      border: 1px solid #ddd9ff;
      border-radius: 999px;
      background: #f3f1ff;
      color: #5352ed;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 600;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    .prd-region-link:hover {
      transform: translateY(-1px);
      background: #ebe8ff;
      box-shadow: 0 8px 16px rgba(83, 82, 237, 0.12);
    }

    @media (max-width: 920px) {
      .filter-grid,
      .form-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .action-bar {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media (max-width: 640px) {
      .page-header {
        align-items: flex-start;
        padding: 18px 16px 64px;
      }

      .prd-open-btn {
        min-height: 34px;
      }

      .header-actions {
        top: auto;
        right: 16px;
        bottom: 16px;
      }

      .content {
        padding: 16px;
      }

      .filter-grid,
      .form-grid {
        grid-template-columns: 1fr;
      }

      .table-container {
        overflow-x: auto;
      }

      .pagination {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="page-shell" id="app">
    <header class="page-header" data-prd-target="page-header" data-prd-label="页面标题区">
      <div>
        <h1 class="page-title">{{页面名称}}</h1>
        <p class="page-subtitle">{{英文副标题或模块说明}}</p>
      </div>
      <div class="header-actions">
        <button class="prd-open-btn" type="button" onclick="toggleInteractiveHighlights()">高亮交互区</button>
        <button class="prd-open-btn" type="button" onclick="openPrdDrawer()">PRD 说明</button>
      </div>
    </header>

    <main class="content">
      <div class="notice">{{页面提示文案}}</div>

      <section class="action-bar" aria-label="操作区" data-prd-target="action-bar" data-prd-label="操作按钮区">
        <div class="button-group">
          <button class="btn btn-primary" type="button" onclick="openFormModal('create')">新增{{对象名称}}</button>
          <button class="btn" type="button" onclick="showToast('已触发导出，请在下载中心查看。')">导出</button>
        </div>
        <div class="button-group">
          <button class="btn" type="button" onclick="showLoadingDemo()">刷新</button>
          <button class="btn btn-danger" type="button" onclick="showToast('批量操作需先勾选数据。')">批量作废</button>
        </div>
      </section>

      <section class="filter-section" aria-label="筛选条件" data-prd-target="filter-section" data-prd-label="筛选条件区">
        <div class="filter-grid">
          <div class="form-item">
            <label for="keyword">关键词</label>
            <input class="input" id="keyword" type="text" placeholder="请输入{{对象名称}}名称或编号">
          </div>
          <div class="form-item">
            <label for="statusFilter">状态</label>
            <select class="select" id="statusFilter">
              <option value="">全部状态</option>
              <option value="编辑中">编辑中</option>
              <option value="未生效">未生效</option>
              <option value="生效中">生效中</option>
              <option value="已过期">已过期</option>
              <option value="已作废">已作废</option>
            </select>
          </div>
          <div class="form-item">
            <label for="ownerFilter">负责人</label>
            <select class="select" id="ownerFilter">
              <option value="">全部负责人</option>
              <option value="{{负责人1}}">{{负责人1}}</option>
              <option value="{{负责人2}}">{{负责人2}}</option>
              <option value="{{负责人3}}">{{负责人3}}</option>
            </select>
          </div>
          <div class="button-group">
            <button class="btn btn-primary" type="button" onclick="applyFilters()">查询</button>
            <button class="btn" type="button" onclick="resetFilters()">重置</button>
          </div>
        </div>
      </section>

      <section class="table-container" aria-label="数据表格" data-prd-target="table-list" data-prd-label="数据表格区">
        <div class="table-toolbar">
          <h2>{{对象名称}}列表</h2>
          <span class="table-tip" id="tableTip">共 0 条数据</span>
        </div>
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" aria-label="全选"></th>
              <th>{{主键列}}</th>
              <th>{{名称列}}</th>
              <th>{{类型列}}</th>
              <th>{{负责人列}}</th>
              <th>{{生效日期列}}</th>
              <th>{{状态列}}</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="tableBody"></tbody>
        </table>
        <div class="empty-state" id="emptyState">暂无符合条件的数据，请调整筛选条件后重试。</div>
        <div class="pagination" data-prd-target="pagination" data-prd-label="分页器">
          <div id="paginationInfo">共 0 条，每页 10 条</div>
          <div class="page-buttons" id="pageButtons"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal-overlay" id="form-modal" data-prd-container="form-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="formTitle" data-prd-target="create-edit-modal" data-prd-label="新增编辑弹窗">
      <div class="modal-header">
        <h3 class="modal-title" id="formTitle">新增{{对象名称}}</h3>
        <button class="close-btn" type="button" onclick="closeModal('form-modal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-item">
            <label for="formCode">{{主键列}}</label>
            <input class="input" id="formCode" type="text" placeholder="系统自动生成或手动输入">
          </div>
          <div class="form-item">
            <label for="formName">{{名称列}}</label>
            <input class="input" id="formName" type="text" placeholder="请输入{{对象名称}}名称">
          </div>
          <div class="form-item">
            <label for="formType">{{类型列}}</label>
            <select class="select" id="formType">
              <option value="{{类型1}}">{{类型1}}</option>
              <option value="{{类型2}}">{{类型2}}</option>
              <option value="{{类型3}}">{{类型3}}</option>
            </select>
          </div>
          <div class="form-item">
            <label for="formOwner">{{负责人列}}</label>
            <select class="select" id="formOwner">
              <option value="{{负责人1}}">{{负责人1}}</option>
              <option value="{{负责人2}}">{{负责人2}}</option>
              <option value="{{负责人3}}">{{负责人3}}</option>
            </select>
          </div>
          <div class="form-item">
            <label for="formDate">{{生效日期列}}</label>
            <input class="input" id="formDate" type="date">
          </div>
          <div class="form-item">
            <label for="formStatus">{{状态列}}</label>
            <select class="select" id="formStatus">
              <option value="编辑中">编辑中</option>
              <option value="未生效">未生效</option>
              <option value="生效中">生效中</option>
              <option value="已过期">已过期</option>
              <option value="已作废">已作废</option>
            </select>
          </div>
          <div class="form-item" style="grid-column: 1 / -1;">
            <label for="formRemark">备注</label>
            <textarea class="textarea" id="formRemark" placeholder="请输入补充说明"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" type="button" onclick="closeModal('form-modal')">取消</button>
        <button class="btn btn-primary" type="button" onclick="saveForm()">保存</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="detail-modal" data-prd-container="detail-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="detailTitle" data-prd-target="detail-modal-target" data-prd-label="详情弹窗">
      <div class="modal-header">
        <h3 class="modal-title" id="detailTitle">{{对象名称}}详情</h3>
        <button class="close-btn" type="button" onclick="closeModal('detail-modal')">×</button>
      </div>
      <div class="modal-body">
        <div class="detail-grid" id="detailGrid"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" type="button" onclick="closeModal('detail-modal')">我知道了</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="delete-modal" data-prd-container="delete-modal">
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="deleteTitle" style="width: min(460px, 100%);" data-prd-target="delete-confirm-modal" data-prd-label="删除确认弹窗">
      <div class="modal-header">
        <h3 class="modal-title" id="deleteTitle">删除确认</h3>
        <button class="close-btn" type="button" onclick="closeModal('delete-modal')">×</button>
      </div>
      <div class="modal-body">
        <p id="deleteText">确认删除该数据吗？删除后不可恢复。</p>
      </div>
      <div class="modal-footer">
        <button class="btn" type="button" onclick="closeModal('delete-modal')">取消</button>
        <button class="btn btn-danger" type="button" onclick="confirmDelete()">确认删除</button>
      </div>
    </div>
  </div>

  <div class="prd-overlay" id="prd-overlay" onclick="closePrdDrawer()"></div>
  <aside class="prd-drawer" id="prd-drawer" aria-label="PRD 需求说明文档" data-prd-target="prd-drawer" data-prd-label="PRD 说明抽屉">
    <div class="prd-drawer-header">
      <div>
        <h2>PRD 需求说明文档</h2>
        <p>{{页面名称}} · {{版本号}} · {{创建日期}}</p>
      </div>
      <button class="prd-close-btn" type="button" onclick="closePrdDrawer()" aria-label="关闭 PRD 说明">×</button>
    </div>
    <div class="prd-content" id="prd-content"></div>
  </aside>

  <div class="toast" id="toast"></div>

  <script>
    const rawData = [
      { id: "{{示例编号1}}", name: "{{示例名称1}}", type: "{{类型1}}", owner: "{{负责人1}}", effectiveDate: "{{示例日期1}}", status: "生效中", remark: "{{示例备注1}}" },
      { id: "{{示例编号2}}", name: "{{示例名称2}}", type: "{{类型2}}", owner: "{{负责人2}}", effectiveDate: "{{示例日期2}}", status: "编辑中", remark: "{{示例备注2}}" },
      { id: "{{示例编号3}}", name: "{{示例名称3}}", type: "{{类型3}}", owner: "{{负责人3}}", effectiveDate: "{{示例日期3}}", status: "未生效", remark: "{{示例备注3}}" },
      { id: "{{示例编号4}}", name: "{{示例名称4}}", type: "{{类型1}}", owner: "{{负责人1}}", effectiveDate: "{{示例日期4}}", status: "已过期", remark: "{{示例备注4}}" },
      { id: "{{示例编号5}}", name: "{{示例名称5}}", type: "{{类型2}}", owner: "{{负责人2}}", effectiveDate: "{{示例日期5}}", status: "已作废", remark: "{{示例备注5}}" }
    ];

    let filteredData = [...rawData];
    let currentPage = 1;
    let pageSize = 10;
    let editingId = null;
    let pendingDeleteId = null;

    const statusClassMap = {
      "编辑中": "status-editing",
      "未生效": "status-not-active",
      "生效中": "status-active",
      "已过期": "status-expired",
      "已作废": "status-invalid"
    };

    function renderTable() {
      const body = document.getElementById("tableBody");
      const emptyState = document.getElementById("emptyState");
      const tableTip = document.getElementById("tableTip");
      const start = (currentPage - 1) * pageSize;
      const pageRows = filteredData.slice(start, start + pageSize);

      tableTip.textContent = `共 ${filteredData.length} 条数据`;
      emptyState.style.display = pageRows.length ? "none" : "block";
      body.innerHTML = pageRows.map(row => `
        <tr>
          <td><input type="checkbox" aria-label="选择 ${row.name}"></td>
          <td>${row.id}</td>
          <td>${row.name}</td>
          <td>${row.type}</td>
          <td>${row.owner}</td>
          <td>${row.effectiveDate}</td>
          <td><span class="status-badge ${statusClassMap[row.status]}">${row.status}</span></td>
          <td>
            <button class="btn-text" type="button" onclick="openDetailModal('${row.id}')">查看</button>
            <button class="btn-text" type="button" onclick="openFormModal('edit', '${row.id}')">编辑</button>
            <button class="btn-text danger" type="button" onclick="openDeleteModal('${row.id}')">删除</button>
          </td>
        </tr>
      `).join("");

      renderPagination();
    }

    function renderPagination() {
      const info = document.getElementById("paginationInfo");
      const buttons = document.getElementById("pageButtons");
      const totalPages = Math.max(1, Math.ceil(filteredData.length / pageSize));
      info.textContent = `共 ${filteredData.length} 条，每页 ${pageSize} 条`;
      buttons.innerHTML = Array.from({ length: totalPages }, (_, index) => {
        const page = index + 1;
        return `<button class="page-btn ${page === currentPage ? "active" : ""}" type="button" onclick="goPage(${page})">${page}</button>`;
      }).join("");
    }

    function goPage(page) {
      currentPage = page;
      renderTable();
    }

    function applyFilters() {
      const keyword = document.getElementById("keyword").value.trim();
      const status = document.getElementById("statusFilter").value;
      const owner = document.getElementById("ownerFilter").value;
      filteredData = rawData.filter(row => {
        const matchKeyword = !keyword || row.id.includes(keyword) || row.name.includes(keyword);
        const matchStatus = !status || row.status === status;
        const matchOwner = !owner || row.owner === owner;
        return matchKeyword && matchStatus && matchOwner;
      });
      currentPage = 1;
      renderTable();
      showToast(`查询完成，共 ${filteredData.length} 条结果。`);
    }

    function resetFilters() {
      document.getElementById("keyword").value = "";
      document.getElementById("statusFilter").value = "";
      document.getElementById("ownerFilter").value = "";
      filteredData = [...rawData];
      currentPage = 1;
      renderTable();
      showToast("筛选条件已重置。");
    }

    function openFormModal(mode, id) {
      editingId = mode === "edit" ? id : null;
      document.getElementById("formTitle").textContent = mode === "edit" ? "编辑{{对象名称}}" : "新增{{对象名称}}";
      const row = rawData.find(item => item.id === id);
      document.getElementById("formCode").value = row ? row.id : "";
      document.getElementById("formName").value = row ? row.name : "";
      document.getElementById("formType").value = row ? row.type : "{{类型1}}";
      document.getElementById("formOwner").value = row ? row.owner : "{{负责人1}}";
      document.getElementById("formDate").value = row ? row.effectiveDate : "";
      document.getElementById("formStatus").value = row ? row.status : "编辑中";
      document.getElementById("formRemark").value = row ? row.remark : "";
      openModal("form-modal");
    }

    function saveForm() {
      const name = document.getElementById("formName").value.trim();
      if (!name) {
        showToast("请填写{{对象名称}}名称。");
        return;
      }
      closeModal("form-modal");
      showToast(editingId ? "编辑成功，列表已刷新。" : "新增成功，列表已刷新。");
    }

    function openDetailModal(id) {
      const row = rawData.find(item => item.id === id);
      if (!row) return;
      document.getElementById("detailGrid").innerHTML = `
        <div class="detail-label">{{主键列}}</div><div>${row.id}</div>
        <div class="detail-label">{{名称列}}</div><div>${row.name}</div>
        <div class="detail-label">{{类型列}}</div><div>${row.type}</div>
        <div class="detail-label">{{负责人列}}</div><div>${row.owner}</div>
        <div class="detail-label">{{生效日期列}}</div><div>${row.effectiveDate}</div>
        <div class="detail-label">{{状态列}}</div><div><span class="status-badge ${statusClassMap[row.status]}">${row.status}</span></div>
        <div class="detail-label">备注</div><div>${row.remark}</div>
      `;
      openModal("detail-modal");
    }

    function openDeleteModal(id) {
      const row = rawData.find(item => item.id === id);
      pendingDeleteId = id;
      document.getElementById("deleteText").textContent = `确认删除「${row ? row.name : id}」吗？删除后不可恢复。`;
      openModal("delete-modal");
    }

    function confirmDelete() {
      closeModal("delete-modal");
      showToast(`已删除 ${pendingDeleteId}，列表已刷新。`);
      pendingDeleteId = null;
    }

    function openModal(id) {
      document.getElementById(id).classList.add("open");
    }

    function closeModal(id) {
      const modal = document.getElementById(id);
      modal.classList.remove("open");
      modal.style.zIndex = "";
    }

    function showLoadingDemo() {
      showToast("正在刷新数据...");
      setTimeout(() => showToast("数据已更新。"), 600);
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.style.display = "block";
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => {
        toast.style.display = "none";
      }, 2200);
    }

    function toggleInteractiveHighlights(force) {
      const shouldShow = typeof force === "boolean" ? force : !document.body.classList.contains("show-interactive");
      document.body.classList.toggle("show-interactive", shouldShow);
      showToast(shouldShow ? "已高亮所有可交互区域。" : "已关闭交互区域高亮。");
    }

    function clearPrdTargetHighlight() {
      document.querySelectorAll(".prd-target-highlight").forEach(target => {
        target.classList.remove("prd-target-highlight");
      });
    }

    function focusPrdTarget(targetId) {
      const target = document.querySelector(`[data-prd-target="${targetId}"]`);
      if (!target) {
        showToast("当前原型中未找到该功能区域。");
        return;
      }

      const hiddenModal = target.closest(".modal-overlay");
      if (hiddenModal && !hiddenModal.classList.contains("open")) {
        hiddenModal.classList.add("open");
        hiddenModal.style.zIndex = "96";
      }

      clearPrdTargetHighlight();
      document.body.classList.add("show-interactive");
      document.body.style.overflow = "";

      requestAnimationFrame(() => {
        target.scrollIntoView({ behavior: "smooth", block: "center", inline: "nearest" });
        target.classList.add("prd-target-highlight");
        showToast(`已定位：${target.dataset.prdLabel || targetId}`);
        clearTimeout(window.__prdHighlightTimer);
        window.__prdHighlightTimer = setTimeout(() => {
          target.classList.remove("prd-target-highlight");
        }, 3200);
      });
    }

    function openPrdDrawer() {
      document.getElementById("prd-content").innerHTML = `
        <div class="prd-drawer-tools">
          <button class="prd-region-link" type="button" onclick="toggleInteractiveHighlights(true)">高亮全部交互区</button>
          <button class="prd-region-link" type="button" onclick="toggleInteractiveHighlights(false); clearPrdTargetHighlight()">关闭高亮</button>
          <button class="prd-region-link" type="button" onclick="focusPrdTarget('page-header')">定位页面标题</button>
        </div>
        ${generatePrdContent()}
      `;
      document.getElementById("prd-overlay").classList.add("open");
      document.getElementById("prd-drawer").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closePrdDrawer() {
      document.getElementById("prd-overlay").classList.remove("open");
      document.getElementById("prd-drawer").classList.remove("open");
      document.body.style.overflow = "";
    }

    function generatePrdContent() {
      return `
        <!-- PRD 章节中的功能说明可使用下面格式定位页面区域：
        <button class="prd-region-link" type="button" onclick="focusPrdTarget('filter-section')">定位筛选区</button>
        <button class="prd-region-link" type="button" onclick="focusPrdTarget('table-list')">定位数据表格</button>
        -->
        {{PRD_HTML内容}}
      `;
    }

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") {
        closePrdDrawer();
        document.querySelectorAll(".modal-overlay.open").forEach(modal => modal.classList.remove("open"));
      }
    });

    renderTable();
  </script>
</body>
</html>
